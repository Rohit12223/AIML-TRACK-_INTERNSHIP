<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDI Result - Human Development Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-visual {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 40%, rgba(0, 60, 180, 0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(100, 0, 200, 0.15) 0%, transparent 50%);
            z-index: 0;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 150, 255, 0.2);
            z-index: 100;
        }

        .navbar .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff3333;
            letter-spacing: 1px;
            font-family: 'Comic Sans MS', cursive;
        }

        .navbar nav a {
            color: #a0c4ff;
            text-decoration: none;
            margin-left: 35px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .navbar nav a:hover {
            color: #ffffff;
        }

        .main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 50px;
        }

        .result-card {
            background: rgba(5, 5, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-radius: 24px;
            padding: 60px;
            width: 100%;
            max-width: 560px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
        }

        .result-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ff2222;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 0.85rem;
            color: #607090;
            font-style: italic;
            margin-bottom: 45px;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 30px;
            margin-bottom: 40px;
        }

        .result-label {
            font-size: 0.8rem;
            color: #607090;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .result-value {
            font-size: 2.1rem;
            font-weight: 800;
            color: #FFC107;
            line-height: 1.3;
            margin-bottom: 18px;
            text-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
        }

        .category-desc {
            font-size: 0.88rem;
            color: #607090;
            line-height: 1.7;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            box-shadow: 0 5px 20px rgba(101,17,203,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #a0c4ff;
            border: 1px solid rgba(0,150,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="bg-visual"></div>

    <div class="navbar">
        <div class="logo">Human Development Index</div>
        <nav>
            <a href="/Home">Home</a>
            <a href="/Prediction">Predict</a>
        </nav>
    </div>

    <div class="main">
        <div class="result-card">
            <h1>Human Development Index</h1>
            <p class="tagline">A machine learning web application using Flask</p>

            <div class="result-box">
                <div class="result-label">Prediction Result</div>
                <div class="result-value">{{ prediction_text }}</div>
                <div class="category-desc">
                    This section shows the predicted HDI score or category based on the values entered in the form.
                </div>
            </div>

            <div class="btn-group">
                <a href="/Prediction" class="btn btn-primary">Predict Again</a>
                <a href="/Home" class="btn btn-secondary">Home</a>
            </div>
        </div>
    </div>
</body>
</html>
